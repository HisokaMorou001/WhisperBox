{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/forum.css' %}">
{% endblock %}
{% block content %}

<h2>Le mie richieste</h2>

{% for idea in ideas %}
<div class="card">
    <h3>{{ idea.title }}</h3>
    <p>{{ idea.description }}</p>
    <small>{{ idea.status }}</small>
</div>
{% endfor %}

{% endblock %}
